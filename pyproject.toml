[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tmux-config-generator"
version = "0.1.0"
description = "GTK 4 GUI for generating tmux configuration files"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Stephen Martina"}]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Environment :: X11 Applications :: GTK",
    "Programming Language :: Python :: 3",
]
dependencies = ["PyGObject>=3.42"]

[project.optional-dependencies]
test = ["pytest"]

[project.gui-scripts]
tmux-config-generator = "tmux_config_generator.app:main"

[tool.setuptools.packages.find]
include = ["tmux_config_generator*"]

[tool.setuptools.package-data]
tmux_config_generator = [
    "data/*.desktop",
    "data/*.xml",
    "data/icons/*.ico",
    "data/icons/*.icns",
    "data/icons/hicolor/*/apps/*",
]
